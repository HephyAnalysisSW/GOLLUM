  # -------------------------------
  # PNN (Parametric NN for local DCR) using the same lSF setup
  # Uses ICP inside the loss/pred via extras.use_icp
  # -------------------------------
  # =========================
  # PNN — selection: tt2l_GG
  # =========================
  - id: pnn_tt2l_GG_Trigger
    type: pnn
    region: SR
    selection: lowMT_VBFJet
    process: tt2l_GG
    parameters: [nu_trigger]
    combinations: [["nu_trigger"]]
    base_points:
      - coords: [-1.0]
        loader: tt2l_GG_TriggerDown
      - coords: [ 0.0]
        loader: tt2l_GG
      - coords: [ 1.0]
        loader: tt2l_GG_TriggerUp
    model: { hidden_layers: [128,128], activation: relu, initialize_zero: true }
    optim: { epochs: 200, phaseout_epochs: 50, learning_rate: 0.001 }
    runtime: { n_split: 10, plot_every: 5, rebin: 2 }
    extras:
      use_scaler: scaler_tt2l_GG
      use_icp: icp_tt2l_GG_Trigger
    output: { filename: "pnn_tt2l_GG_Trigger.pkl" }
  
