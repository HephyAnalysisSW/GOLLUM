version: v1

defaults:
  module_samples: "data.samples"     # jobs import datasets/views by name from here
  observer_weight: "weight"
  batch_size: 65536
  num_workers: 0
  seed: 1
  reuse_existing_artifacts: true

jobs:

  - include: bit_split.yaml
  # -------------------------------
  # Inclusive Cross Section (IC)
  # -------------------------------
  - id: ic_tt2l
    type: ic
    region: SR
    process: tt2l
    selection: null
    output:
      filename: "IC_tt2l.pkl"
  - id: ic_tt2l_GG
    type: ic
    region: SR
    process: tt2l_GG
    selection: null
    output:
      filename: "IC_tt2l_GG.pkl"

  - id: ic_tt2l_QG
    type: ic
    region: SR
    process: tt2l_QG
    selection: null
    output:
      filename: "IC_tt2l_QG.pkl"

  - id: ic_tt2l_QQ
    type: ic
    region: SR
    process: tt2l_QQ
    selection: null
    output:
      filename: "IC_tt2l_QQ.pkl"

  # -------------------------------
  # Scalers 
  # -------------------------------
  - id: scaler_tt2l
    type: scaler
    region: SR
    process: tt2l
    selection: null
    output:
      filename: "Scaler_tt2l.pkl"

  - id: scaler_tt2l_GG
    type: scaler
    region: SR
    process: tt2l_GG
    selection: null
    output:
      filename: "Scaler_tt2l_GG.pkl"

  - id: scaler_tt2l_QG
    type: scaler
    region: SR
    process: tt2l_QG
    selection: null
    output:
      filename: "Scaler_tt2l_QG.pkl"

  - id: scaler_tt2l_QQ
    type: scaler
    region: SR
    process: tt2l_QQ
    selection: null
    output:
      filename: "Scaler_tt2l_QQ.pkl"

  # -------------------------------
  # TFMC classifier (split processes)
  # -------------------------------
  - id: tfmc_split_processes
    type: classifier
    region: SR
    framework: "tfmc"
    data:
      classes: [tt2l_GG, tt2l_QG, tt2l_QQ]
      #weight: "${observer_weight}"
    model:
      activation: relu
      hidden_layers: [128, 128]
    optim:
      epochs: 500
      phaseout_epochs: 0
      learning_rate: 0.02
    runtime:
      batch_size: 65536
      num_workers: 1
      seed: 1
    extras:
      use_ic: ic_tt2l
      use_scaler: scaler_tt2l
    output:
      filename: "tfmc_no_reg.pkl"

  # -------------------------------
  # ICP (Inclusive Cross-Section Parametrization) for lepton SF (quadratic)
  # Base points: {-1, 0, +1} using GG views
  # -------------------------------

  # =========================
  # Selection: tt2l_GG
  # =========================
  - id: icp_tt2l_GG_Trigger
    type: icp
    region: SR
    base_point_loaders:
      0: tt2l_GG_TriggerDown
      1: tt2l_GG
      2: tt2l_GG_TriggerUp
    parameters: [nu_trigger]
    combinations:
      - [nu_trigger]
    base_points:
      0: [-1.0]
      1: [ 0.0]
      2: [ 1.0]
    nominal_index: 1
    train_ratio: true
    output:
      filename: icp_tt2l_GG_Trigger.pkl

  - id: icp_tt2l_GG_L1Prefire
