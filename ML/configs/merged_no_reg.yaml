version: v1

defaults:
  module_samples: "data.samples"     # jobs import datasets/views by name from here
  observer_weight: "weight"
  batch_size: 65536
  num_workers: 0
  seed: 1
  reuse_existing_artifacts: true

jobs:
  - include: bit_merged.yaml

  # -------------------------------
  # Inclusive Cross Section (IC)
  # -------------------------------
  - id: ic_tt2l
    type: ic
    process: tt2l
    region: SR
    selection: null
    output:
      filename: "IC_tt2l.pkl"

  # -------------------------------
  # Scalers (one per class/view)
  # -------------------------------
  - id: scaler_tt2l
    type: scaler
    process: tt2l
    region: SR
    selection: null
    output:
      filename: "Scaler_tt2l.pkl"

  # -------------------------------
  # ICP (Inclusive Cross-Section Parametrization) for lepton SF (quadratic)
  # Base points: {-1, 0, +1} using GG views
  # -------------------------------
  # =========================
  # Base sample: tt2l
  # =========================
  - id: icp_tt2l_Trigger_quad
    type: icp
    region: SR
    base_point_loaders:
      0: tt2l_TriggerDown
      1: tt2l
      2: tt2l_TriggerUp
    parameters: [nu_trigger]
    combinations:
      - [nu_trigger]
      - [nu_trigger, nu_trigger]
    base_points:
      0: [-1.0]
      1: [ 0.0]
      2: [ 1.0]
    nominal_index: 1
    train_ratio: true
    output:
      filename: icp_tt2l_Trigger_quad.pkl

  - id: icp_tt2l_L1Prefire_quad
    type: icp
    region: SR
    base_point_loaders:
      0: tt2l_L1PrefireDown
      1: tt2l
      2: tt2l_L1PrefireUp
    parameters: [nu_l1prefire]
    combinations:
      - [nu_l1prefire]
      - [nu_l1prefire, nu_l1prefire]
    base_points:
      0: [-1.0]
      1: [ 0.0]
      2: [ 1.0]
    nominal_index: 1
    train_ratio: true
    output:
      filename: icp_tt2l_L1Prefire_quad.pkl

  - id: icp_tt2l_PU_quad
    type: icp
    region: SR
    base_point_loaders:
      0: tt2l_PUDown
      1: tt2l
      2: tt2l_PUUp
    parameters: [nu_pu]
    combinations:
      - [nu_pu]
      - [nu_pu, nu_pu]
    base_points:
      0: [-1.0]
      1: [ 0.0]
      2: [ 1.0]
    nominal_index: 1
    train_ratio: true
    output:
      filename: icp_tt2l_PU_quad.pkl

  - id: icp_tt2l_LeptonSF_quad
    type: icp
    region: SR
    base_point_loaders:
      0: tt2l_LeptonSFDown
      1: tt2l
      2: tt2l_LeptonSFUp
    parameters: [nu_leptonsf]
    combinations:
      - [nu_leptonsf]
      - [nu_leptonsf, nu_leptonsf]
    base_points:
      0: [-1.0]
      1: [ 0.0]
      2: [ 1.0]
    nominal_index: 1
    train_ratio: true
    output:
      filename: icp_tt2l_LeptonSF_quad.pkl

  - id: icp_tt2l_BTag_b_quad
    type: icp
    region: SR
    base_point_loaders:
      0: tt2l_BTag_b_Down
      1: tt2l
      2: tt2l_BTag_b_Up
    parameters: [nu_btag_b]
    combinations:
      - [nu_btag_b]
      - [nu_btag_b, nu_btag_b]
    base_points:
      0: [-1.0]
      1: [ 0.0]
      2: [ 1.0]
    nominal_index: 1
    train_ratio: true
    output:
      filename: icp_tt2l_BTag_b_quad.pkl

  - id: icp_tt2l_BTag_l_quad
    type: icp
    region: SR
    base_point_loaders:
      0: tt2l_BTag_l_Down
      1: tt2l
      2: tt2l_BTag_l_Up
    parameters: [nu_btag_l]
    combinations:
      - [nu_btag_l]
      - [nu_btag_l, nu_btag_l]
    base_points:
      0: [-1.0]
      1: [ 0.0]
      2: [ 1.0]
    nominal_index: 1
    train_ratio: true
    output:
      filename: icp_tt2l_BTag_l_quad.pkl

  # -------------------------------
  # PNN (Parametric NN for local DCR) using the same lSF setup
  # Uses ICP inside the loss/pred via extras.use_icp
  # -------------------------------
  # =========================
  # PNN — base sample: tt2l
  # =========================
  - id: pnn_tt2l_Trigger
    type: pnn
    region: SR
    selection: lowMT_VBFJet
    process: tt2l
    parameters: [nu_trigger]
    combinations: [["nu_trigger"]]           # linear
    # combinations: [["nu_trigger"], ["nu_trigger","nu_trigger"]]  # quadratic
    base_points:
      - coords: [-1.0]
        loader: tt2l_TriggerDown
      - coords: [ 0.0] 
        loader: tt2l
      - coords: [ 1.0] 
        loader: tt2l_TriggerUp
    model: { hidden_layers: [128,128], activation: relu, initialize_zero: true }
    optim: { epochs: 200, phaseout_epochs: 50, learning_rate: 0.001 }
    runtime: { n_split: 10, plot_every: 5, rebin: 2 }
    extras:
      use_scaler: true
      use_icp: true
      depends_on: [scaler_tt2l, icp_tt2l_Trigger_quad]
      icp_job_id: icp_tt2l_Trigger_quad
    output: 
      filename: "pnn_tt2l_Trigger.pkl"

  - id: pnn_tt2l_L1Prefire
    type: pnn
    region: SR
    selection: lowMT_VBFJet
    process: tt2l
    parameters: [nu_l1prefire]
    combinations: [["nu_l1prefire"]]
    # combinations: [["nu_l1prefire"], ["nu_l1prefire","nu_l1prefire"]]
    base_points:
      - coords: [-1.0]
        loader: tt2l_L1PrefireDown
      - coords: [ 0.0]
        loader: tt2l
      - coords: [ 1.0]
        loader: tt2l_L1PrefireUp
    model: { hidden_layers: [128,128], activation: relu, initialize_zero: true }
    optim: { epochs: 200, phaseout_epochs: 50, learning_rate: 0.001 }
    runtime: { n_split: 10, plot_every: 5, rebin: 2 }
    extras:
      use_scaler: true
      use_icp: true
      depends_on: [scaler_tt2l, icp_tt2l_L1Prefire_quad]
      icp_job_id: icp_tt2l_L1Prefire_quad
    output: { filename: "pnn_tt2l_L1Prefire.pkl" }
  
  - id: pnn_tt2l_PU
    type: pnn
    region: SR
    selection: lowMT_VBFJet
    process: tt2l
    parameters: [nu_pu]
    combinations: [["nu_pu"]]
    # combinations: [["nu_pu"], ["nu_pu","nu_pu"]]
    base_points:
      - coords: [-1.0]
        loader: tt2l_PUDown
      - coords: [ 0.0]
        loader: tt2l
      - coords: [ 1.0]
        loader: tt2l_PUUp
    model: { hidden_layers: [128,128], activation: relu, initialize_zero: true }
    optim: { epochs: 200, phaseout_epochs: 50, learning_rate: 0.001 }
    runtime: { n_split: 10, plot_every: 5, rebin: 2 }
    extras:
      use_scaler: true
      use_icp: true
      depends_on: [scaler_tt2l, icp_tt2l_PU_quad]
      icp_job_id: icp_tt2l_PU_quad
    output: { filename: "pnn_tt2l_PU.pkl" }
  
  - id: pnn_tt2l_LeptonSF
    type: pnn
    region: SR
    selection: lowMT_VBFJet
    process: tt2l
    parameters: [nu_leptonsf]
    combinations: [["nu_leptonsf"]]
    # combinations: [["nu_leptonsf"], ["nu_leptonsf","nu_leptonsf"]]
    base_points:
      - coords: [-1.0]
        loader: tt2l_LeptonSFDown
      - coords: [ 0.0]
        loader: tt2l
      - coords: [ 1.0]
        loader: tt2l_LeptonSFUp
    model: { hidden_layers: [128,128], activation: relu, initialize_zero: true }
    optim: { epochs: 200, phaseout_epochs: 50, learning_rate: 0.001 }
    runtime: { n_split: 10, plot_every: 5, rebin: 2 }
    extras:
      use_scaler: true
      use_icp: true
      depends_on: [scaler_tt2l, icp_tt2l_LeptonSF_quad]
      icp_job_id: icp_tt2l_LeptonSF_quad
    output: { filename: "pnn_tt2l_LeptonSF.pkl" }
  
  - id: pnn_tt2l_BTag_b
    type: pnn
    region: SR
    selection: lowMT_VBFJet
    process: tt2l
    parameters: [nu_btag_b]
    combinations: [["nu_btag_b"]]
    # combinations: [["nu_btag_b"], ["nu_btag_b","nu_btag_b"]]
    base_points:
      - coords: [-1.0]
        loader: tt2l_BTag_b_Down
      - coords: [ 0.0]
        loader: tt2l
      - coords: [ 1.0]
        loader: tt2l_BTag_b_Up
    model: { hidden_layers: [128,128], activation: relu, initialize_zero: true }
    optim: { epochs: 200, phaseout_epochs: 50, learning_rate: 0.001 }
    runtime: { n_split: 10, plot_every: 5, rebin: 2 }
    extras:
      use_scaler: true
      use_icp: true
      depends_on: [scaler_tt2l, icp_tt2l_BTag_b_quad]
      icp_job_id: icp_tt2l_BTag_b_quad
    output: { filename: "pnn_tt2l_BTag_b.pkl" }
  
  - id: pnn_tt2l_BTag_l
    type: pnn
    region: SR
    selection: lowMT_VBFJet
    process: tt2l
    parameters: [nu_btag_l]
    combinations: [["nu_btag_l"]]
    # combinations: [["nu_btag_l"], ["nu_btag_l","nu_btag_l"]]
    base_points:
      - coords: [-1.0]
        loader: tt2l_BTag_l_Down
      - coords: [ 0.0]
        loader: tt2l
      - coords: [ 1.0]
        loader: tt2l_BTag_l_Up
    model: { hidden_layers: [128,128], activation: relu, initialize_zero: true }
    optim: { epochs: 200, phaseout_epochs: 50, learning_rate: 0.001 }
    runtime: { n_split: 10, plot_every: 5, rebin: 2 }
    extras:
      use_scaler: true
      use_icp: true
      depends_on: [scaler_tt2l, icp_tt2l_BTag_l_quad]
      icp_job_id: icp_tt2l_BTag_l_quad
    output: { filename: "pnn_tt2l_BTag_l.pkl" }
  
  
