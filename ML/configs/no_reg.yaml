# File: configs/train_config.yaml
version: 1

project:
  name: SBI-PDF

defaults:
  module_samples: "data.samples"           # jobs import datasets/views by name from here
  observer_weight: "weight"
  batch_size: 65536
  num_workers: 0                           # if you later parallelize I/O
  seed: 1
  # When true, a trainer may skip re-running deps if their artifacts exist
  reuse_existing_artifacts: true

datasets:
  # The code will import these by name from `data.samples`.
  # Listed here only for discoverability / validation.
  available:
    - tt2l
    - tt2l_GG
    - tt2l_QG
    - tt2l_QQ

jobs:
  # -------------------------------
  # Inclusive Cross Section (IC)
  # -------------------------------
  - id: ic_tt2l_GG
    type: ic
    process: tt2l_GG               # sample or view name from data.samples
    selection: null                # optional extra selection layered on top (None for now)
    output:
      filename: "IC_tt2l_GG.pkl"

  - id: ic_tt2l_QG
    type: ic
    process: tt2l_QG
    selection: null
    output:
      filename: "IC_tt2l_QG.pkl"

  - id: ic_tt2l_QQ
    type: ic
    process: tt2l_QQ
    selection: null
    output:
      filename: "IC_tt2l_QQ.pkl"

  # -------------------------------
  # Scalers (one per class/view)
  # -------------------------------
  - id: scaler_tt2l_GG
    type: scaler
    process: tt2l_GG
    selection: null
    output:
      filename: "Scaler_tt2l_GG.pkl"

  - id: scaler_tt2l_QG
    type: scaler
    process: tt2l_QG
    selection: null
    output:
      filename: "Scaler_tt2l_QG.pkl"

  - id: scaler_tt2l_QQ
    type: scaler
    process: tt2l_QQ
    selection: null
    output:
      filename: "Scaler_tt2l_QQ.pkl"

  - id: tfmc_split_processes
    type: classifier
    framework: "tfmc"              # free-form tag your trainer can switch on
    data:
      classes: [tt2l_GG, tt2l_QG, tt2l_QQ]   # import these from data.samples
      # features/observers come from each loader; trainer should validate they share same feature layout
      weight: "${observer_weight}"
    model:
      activation: relu
      hidden_layers: [128, 128]
    optim:
      epochs: 500
      phaseout_epochs: 0
      learning_rate: 0.02
    runtime:
      batch_size: 65536 
      num_workers: 1 
      seed: 1 
    extras:
      use_ic: true
      use_scaler: true
      # Optionally declare dependencies; your runner can ensure they exist or trigger them first
      depends_on:
        - ic_tt2l_GG
        - ic_tt2l_QG
        - ic_tt2l_QQ
        - scaler_tt2l_GG
        - scaler_tt2l_QG
        - scaler_tt2l_QQ
    output:
      filename: "tfmc_no_reg.pkl"    

# --- ICP job --------------------------------------------------------------
  - id: icp_lSF_quad_GG
    type: icp

    # Which loaders to use for each base point (keys must match base_points)
    # Use any loader/view name from your samples module (e.g. tt2l_GG, tt2l_GG_LeptonSFUp/Down).
    base_point_loaders:
      0: tt2l_GG_LeptonSFDown
      1: tt2l_GG
      2: tt2l_GG_LeptonSFUp

    # Nuisance parameters and log-poly terms we fit
    parameters: [nu_lSF]
    combinations:
      - [nu_lSF]           # linear
      - [nu_lSF, nu_lSF]   # quadratic

    # Base-point coordinates in the nuisance space (flexible & multi-dim ready)
    base_points:
      0: [-1.0]
      1: [ 0.0]
      2: [ 1.0]

    nominal_index: 1        # which base point is the nominal (SM)

    # Train ratios (log σ(nu)/σ(nominal)); set false to fit absolute (requires constant term ())
    train_ratio: true

    # Optional: extra selection on features (refers to common/selections.py key)
    # selection: lowMT_VBFJet
    # mva_selection: SomeMVAKey

    output:
      filename: "icp_tt2l_GG_lSF_quad.pkl"
