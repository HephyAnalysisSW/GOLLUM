# File: configs/no_reg.yaml
version: 1

project:
  name: SBI-PDF

defaults:
  module_samples: "data.samples"     # jobs import datasets/views by name from here
  observer_weight: "weight"
  batch_size: 65536
  num_workers: 0
  seed: 1
  reuse_existing_artifacts: true

jobs:
  # -------------------------------
  # Inclusive Cross Section (IC)
  # -------------------------------
  - id: ic_tt2l_GG
    type: ic
    process: tt2l_GG
    selection: null
    output:
      filename: "IC_tt2l_GG.pkl"

  - id: ic_tt2l_QG
    type: ic
    process: tt2l_QG
    selection: null
    output:
      filename: "IC_tt2l_QG.pkl"

  - id: ic_tt2l_QQ
    type: ic
    process: tt2l_QQ
    selection: null
    output:
      filename: "IC_tt2l_QQ.pkl"

  # -------------------------------
  # Scalers (one per class/view)
  # -------------------------------
  - id: scaler_tt2l
    type: scaler
    process: tt2l
    selection: null
    output:
      filename: "Scaler_tt2l.pkl"

  - id: scaler_tt2l_GG
    type: scaler
    process: tt2l_GG
    selection: null
    output:
      filename: "Scaler_tt2l_GG.pkl"

  - id: scaler_tt2l_QG
    type: scaler
    process: tt2l_QG
    selection: null
    output:
      filename: "Scaler_tt2l_QG.pkl"

  - id: scaler_tt2l_QQ
    type: scaler
    process: tt2l_QQ
    selection: null
    output:
      filename: "Scaler_tt2l_QQ.pkl"

  # -------------------------------
  # TFMC classifier (split processes)
  # -------------------------------
  - id: tfmc_split_processes
    type: classifier
    framework: "tfmc"
    data:
      classes: [tt2l_GG, tt2l_QG, tt2l_QQ]
    model:
      activation: relu
      hidden_layers: [128, 128]
    optim:
      epochs: 500
      phaseout_epochs: 0
      learning_rate: 0.02
    runtime:
      batch_size: 65536
      num_workers: 1
      seed: 1
    extras:
      use_ic: true
      use_scaler: true
      depends_on:
        - ic_tt2l_GG
        - ic_tt2l_QG
        - ic_tt2l_QQ
        - scaler_tt2l_GG
        - scaler_tt2l_QG
        - scaler_tt2l_QQ
    output:
      filename: "tfmc_no_reg.pkl"

  - include: [default_icp_pnn.yaml, bit.yaml]
