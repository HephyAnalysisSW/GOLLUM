version: unbinned_v7_eft_genpoint_wider_training_tighter_selection
# uses models symlink from unbinned_v7_eft_genpoint

defaults:
  module_samples: "data.samples_eft"
  default_features:
    - TOP_KINEMATICS
    - LEPTON_KINEMATICS
    - ASYMMETRY
    - SPIN_CORRELATION
  
  default_selection: (tr_ttbar_pt < 1500) & (tr_ttbar_mass < 1000)

  default_selection_features:
    - tr_ttbar_pt
    - tr_ttbar_mass

  splitting:
    enabled: true
    type: uid
    uid_fields: ["run", "luminosityBlock", "event"]
    seed: 42
    n_buckets: 10000 

    scheme:
      pnn_train:     { fraction: 0.50 }
      pnn_val:       { fraction: 0.10 }
      c2st_train:    { fraction: 0.15 }
      c2st_val:      { fraction: 0.05 }
      final_eval:    { fraction: 0.20 }

  early_stopping:
    enabled: true
    patience: 20        # same as current hard-coded
    min_delta: 0.0      # improvement threshold; keep 0.0 to match current behavior
    mode: "min"         # val_loss should decrease
    warmup_epochs: 0    # optional: do not early-stop before this epoch


likelihood:
    regions:
        - id: SR_2018 
          classifier:
            type: null
            id: null    # no classifier needed for a single process
            asimov: [TT01j2l_EFT_2018]
          classes: 
            - id: TT01j2l_EFT_2018
              sample: TT01j2l_EFT_2018 
              POI:
                job: bit_TT01j2l_EFT_2018_ML4EFT_top3 
                type: bit
                parameters: [ctGRe, ctGIm, cQj18]

jobs: 

  - id: bit_TT01j2l_EFT_2018_ML4EFT_top3
    type: bit
    region: SR_2018
    process: TT01j2l_EFT_2018
    selection: null
    numba: True
    eft:
        parameters: [ctGRe, ctGIm, cQj18]
    model:
      n_trees: 400
      learning_rate: 0.2
      loss: MSE
      learn_global_score: true
      split_mode: "binned"
      n_bins: 256
      quantile_bins: true
    runtime:
      training_plots: true
      n_split: 3
    output:
      filename: "bit_TT01j2l_EFT_2018_ML4EFT_top3.pkl"      