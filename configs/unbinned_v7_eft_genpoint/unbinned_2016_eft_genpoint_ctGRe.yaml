  - id: bit_TT01j2l_EFT_2016_ctGRe
    type: bit
    region: SR_2016
    process: TT01j2l_EFT_2016
    selection: null
    numba: True
    n_ensemble: 2   # BIT ensembling test: train members with --i_ensemble 0,1
    eft:
        parameters: [ctGRe]
    model:
      n_trees: 400
      learning_rate: 0.2
      loss: MSE
      learn_global_score: true
      split_mode: "binned"
      n_bins: 256
      quantile_bins: true
      # additional config handles
      # max_depth (def: 4)
      # min_size (def: 50)
      # max_n_split (def: -1)
      # positive (positivity constraints, def: False)
      # min_node_size_neg_adjust (optional negative-adjust, def: False)
      # _get_only_score (?)
      # lr can be "auto": tune lr s.t. it learns 98%
    runtime:
      training_plots: true
    output:
      filename: "bit_TT01j2l_EFT_2016_ctGRe.pkl"

