  - id: icph_tt2l_GG_scales
    type: icph
    region: SR_binned
    parameters: [nu_mu_ren, nu_mu_fac]
    combinations: [[nu_mu_ren], [nu_mu_fac], [nu_mu_ren, nu_mu_ren], [nu_mu_ren, nu_mu_fac], [nu_mu_fac, nu_mu_fac]]
    binning:
      - ["tr_ttbar_mass", [500, 620, 820, 1100, 1500, 2500]]
      #- ["tr_ttbar_pt",   [-1e9, 300, 1e9]]
    base_points:
      - coords: [-1.0, -1.0]
        loader: tt2l
        addweights: ["scale_ren0p5_fac0p5"]
      - coords: [-1.0, 0]
        loader: tt2l
        addweights: ["scale_ren0p5_fac1p0"]
      - coords: [-1.0, 1.0]
        loader: tt2l
        addweights: ["scale_ren0p5_fac2p0"]
      - coords: [0, -1.0]
        loader: tt2l
        addweights: ["scale_ren1p0_fac0p5"]
      - coords: [0, 0]
        loader: tt2l
        addweights: ["scale_ren1p0_fac1p0"]
        nominal: true
      - coords: [0, 1.0]
        loader: tt2l
        addweights: ["scale_ren1p0_fac2p0"]
      - coords: [1.0, -1.0]
        loader: tt2l
        addweights: ["scale_ren2p0_fac0p5"]
      - coords: [1.0, 0]
        loader: tt2l
        addweights: ["scale_ren2p0_fac1p0"]
      - coords: [1.0, 1.0]
        loader: tt2l
        addweights: ["scale_ren2p0_fac2p0"]
    output: { filename: "icph_tt2l_GG_scales.pkl" }

  - id: icph_tt2l_GG_jesTotal
    type: icph
    region: SR_binned
    parameters: [nu_jes]
    combinations: [[nu_jes], [nu_jes, nu_jes]]
    binning:
      - ["tr_ttbar_mass", [500, 620, 820, 1100, 1500, 2500]]
    base_points:
      - coords: [-2.0]
        loader: tt2l_2p0_jesTotalDown
      - coords: [-1.5]
        loader: tt2l_1p5_jesTotalDown 
      - coords: [-1.0]
        loader: tt2l_1p0_jesTotalDown
      - coords: [-0.5]
        loader: tt2l_0p5_jesTotalDown
      - coords: [0]
        loader: tt2l_jesNominal
        nominal: true
      - coords: [0.5]
        loader: tt2l_0p5_jesTotalUp
      - coords: [1.0]
        loader: tt2l_1p0_jesTotalUp
      - coords: [1.5]
        loader: tt2l_1p5_jesTotalUp
      - coords: [2.0]
        loader: tt2l_2p0_jesTotalUp
    output: { filename: "icph_tt2l_GG_jesTotal.pkl" }

