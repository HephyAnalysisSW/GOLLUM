version: unbinned_v8_eft_genpoint_withera_noselection_nofinaleval

defaults:
  module_samples: "data.samples_eft"
  default_features:
    - TOP_KINEMATICS
    - LEPTON_KINEMATICS
    - ASYMMETRY
    - SPIN_CORRELATION
    - era

  splitting:
    enabled: true
    type: uid
    uid_fields: ["run", "luminosityBlock", "event"]
    seed: 42
    n_buckets: 10000 

    scheme:
      pnn_train:     { fraction: 0.66 }
      pnn_val:       { fraction: 0.14 }
      c2st_train:    { fraction: 0.15 }
      c2st_val:      { fraction: 0.05 }
      final_eval:    { fraction: 0.0 }

  early_stopping:
    enabled: true
    patience: 20        # same as current hard-coded
    min_delta: 0.0      # improvement threshold; keep 0.0 to match current behavior
    mode: "min"         # val_loss should decrease
    warmup_epochs: 0    # optional: do not early-stop before this epoch


# descending order of FI from ML4EFT:
# ctGRe, ctGIm, ctj8, cQj18, cQu8, ctu8, cQd8, ctd8, cQj38,
# not in ML4EFT
# cQd1, ctj1, cQj31, ctd1,  cQj11,  ctu1, cQu1,

likelihood:
    regions:
        - id: SR_RunII 
          classifier:
            type: null
            id: null    # no classifier needed for a single process
            asimov: [TT01j2l_EFT_RunII]
          classes: 
            - id: TT01j2l_EFT_RunII
              sample: TT01j2l_EFT_RunII 
              POI:
                job: bit_TT01j2l_EFT_RunII_allWC_ensemble 
                type: bit
                parameters: [cQd1, ctj1, cQj31, ctj8, ctd1, ctd8, ctGRe, ctGIm, cQj11, cQj18, ctu8, cQd8, ctu1, cQu1, cQj38, cQu8]

jobs:

  - id: bit_TT01j2l_EFT_RunII_allWC_ensemble
    type: bit
    region: SR_RunII
    process: TT01j2l_EFT_RunII
    selection: null
    numba: True
    eft:
        parameters: [cQd1, ctj1, cQj31, ctj8, ctd1, ctd8, ctGRe, ctGIm, cQj11, cQj18, ctu8, cQd8, ctu1, cQu1, cQj38, cQu8]
    model:
      n_trees: 1200
      learning_rate: 0.8
      loss: MSE
      learn_global_score: true
      split_mode: "binned"
      n_bins: 256
      quantile_bins: true
    n_ensemble: 10
    runtime:
      n_split: 12
    use_last: True
    output:
      filename: "bit_TT01j2l_EFT_RunII_allWC.pkl"

  - id: scaler_TT01j2l_EFT_RunII
    type: scaler
    process: TT01j2l_EFT_RunII
    region: SR_RunII
    selection: null
    output:
      filename: "Scaler_TT01j2l_EFT_RunII.pkl"

  - id: icp_TT01j2l_EFT_RunII_L1Prefire
    type: icp
    region: SR_RunII
    parameters: [nu_l1prefire]
    combinations: [[nu_l1prefire]]
    base_points:
    - coords: [-1.0]
      loader: TT01j2l_EFT_RunII
      removeweights: ["L1PreFiringWeight_Nom"]
      addweights: ["L1PreFiringWeight_Dn"]
    - coords: [0.0]
      loader: TT01j2l_EFT_RunII
      nominal: true
    - coords: [1.0]
      loader: TT01j2l_EFT_RunII
      removeweights: ["L1PreFiringWeight_Nom"]
      addweights: ["L1PreFiringWeight_Up"]
    train_ratio: true
    output:
      filename: icp_TT01j2l_EFT_RunII_L1Prefire.pkl

  - id: pnn_TT01j2l_EFT_RunII_L1Prefire
    type: pnn
    region: SR_RunII
    parameters: [nu_l1prefire]
    combinations: [[nu_l1prefire]]
    base_points:
    - coords: [-1.0]
      loader: TT01j2l_EFT_RunII
      removeweights: ["L1PreFiringWeight_Nom"]
      addweights: ["L1PreFiringWeight_Dn"]
    - coords: [0.0]
      loader: TT01j2l_EFT_RunII
      nominal: true
    - coords: [1.0]
      loader: TT01j2l_EFT_RunII
      removeweights: ["L1PreFiringWeight_Nom"]
      addweights: ["L1PreFiringWeight_Up"]
    model:
      hidden_layers:
      - 128
      - 128
      activation: relu
      initialize_zero: true
    optim:
      epochs: 200
      phaseout_epochs: 50
      learning_rate: 0.001
    runtime:
      n_split: 12
      rebin: 2
    extras:
      use_scaler: scaler_TT01j2l_EFT_RunII
      use_icp: icp_TT01j2l_EFT_RunII_L1Prefire

