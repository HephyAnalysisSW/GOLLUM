version: unbinned_v8_eft_genpoint_withera_noselection_nofinaleval

defaults:
  module_samples: "data.samples_eft"
  default_features:
    - TOP_KINEMATICS
    - LEPTON_KINEMATICS
    - ASYMMETRY
    - SPIN_CORRELATION
    - era

  splitting:
    enabled: true
    type: uid
    uid_fields: ["run", "luminosityBlock", "event"]
    seed: 42
    n_buckets: 10000 

    scheme:
      pnn_train:     { fraction: 0.66 }
      pnn_val:       { fraction: 0.14 }
      c2st_train:    { fraction: 0.15 }
      c2st_val:      { fraction: 0.05 }
      final_eval:    { fraction: 0.00 } # using c2st_train and c2st_eval to do the final evals

    # allows building the Asimov from subset of events
    # leave empty to use all the events
    asimov_split: [c2st_train, c2st_val]

  early_stopping:
    enabled: true
    patience: 20        # same as current hard-coded
    min_delta: 0.0      # improvement threshold; keep 0.0 to match current behavior
    mode: "min"         # val_loss should decrease
    warmup_epochs: 0    # optional: do not early-stop before this epoch


likelihood:
    regions:
        - id: SR_RunII 
          classifier:
            type: null
            id: null    # no classifier needed for a single process
            asimov: [TT01j2l_EFT_RunII]
          classes: 
            - id: TT01j2l_EFT_RunII
              sample: TT01j2l_EFT_RunII 
              POI:
                job: bit_TT01j2l_EFT_RunII_ML4EFT_all_ensemble 
                type: bit
                parameters: [ctGRe, ctGIm, ctj8, cQj18, cQu8, ctu8, cQd8, ctd8, cQj38]

              systematics:                
                - id: PU
                  type: pnn
                  job: pnn_TT01j2l_EFT_RunII_PU
                  parameters: [nu_pu]
                - id: MuSF 
                  type: pnn
                  job: pnn_TT01j2l_EFT_RunII_MuSF
                  parameters: [nu_MuSF]
                - id: EleSF
                  type: pnn
                  job: pnn_TT01j2l_EFT_RunII_EleSF
                  parameters: [nu_EleSF]
                - id: BTag_b
                  type: pnn
                  job: pnn_TT01j2l_EFT_RunII_BTag_b
                  parameters: [nu_btag_b]
                - id: BTag_l
                  type: pnn
                  job: pnn_TT01j2l_EFT_RunII_BTag_l
                  parameters: [nu_btag_l]
                - id: Scales
                  type: pnn
                  job: pnn_TT01j2l_EFT_RunII_scales
                  parameters: [nu_mu_ren, nu_mu_fac]
                - id: CMS_scale_j_FlavorPureBottom
                  type: pnn
                  job: pnn_TT01j2l_EFT_RunII_CMS_scale_j_FlavorPureBottom
                  parameters: [nu_CMS_scale_j_FlavorPureBottom]
                - id: CMS_scale_j_FlavorPureCharm
                  type: pnn
                  job: pnn_TT01j2l_EFT_RunII_CMS_scale_j_FlavorPureCharm
                  parameters: [nu_CMS_scale_j_FlavorPureCharm]
                - id: CMS_scale_j_FlavorPureGluon
                  type: pnn
                  job: pnn_TT01j2l_EFT_RunII_CMS_scale_j_FlavorPureGluon
                  parameters: [nu_CMS_scale_j_FlavorPureGluon]
                - id: CMS_scale_j_FlavorPureQuark
                  type: pnn
                  job: pnn_TT01j2l_EFT_RunII_CMS_scale_j_FlavorPureQuark
                  parameters: [nu_CMS_scale_j_FlavorPureQuark]
                - id: CMS_scale_j_Regrouped_Absolute
                  type: pnn
                  job: pnn_TT01j2l_EFT_RunII_CMS_scale_j_Regrouped_Absolute
                  parameters: [nu_CMS_scale_j_Regrouped_Absolute]
                - id: CMS_scale_j_Regrouped_BBEC1
                  type: pnn
                  job: pnn_TT01j2l_EFT_RunII_CMS_scale_j_Regrouped_BBEC1
                  parameters: [nu_CMS_scale_j_Regrouped_BBEC1]
                - id: CMS_scale_j_Regrouped_EC2
                  type: pnn
                  job: pnn_TT01j2l_EFT_RunII_CMS_scale_j_Regrouped_EC2
                  parameters: [nu_CMS_scale_j_Regrouped_EC2]
                - id: CMS_scale_j_Regrouped_HF
                  type: pnn
                  job: pnn_TT01j2l_EFT_RunII_CMS_scale_j_Regrouped_HF
                  parameters: [nu_CMS_scale_j_Regrouped_HF]
                - id: CMS_scale_j_Regrouped_RelativeBal
                  type: pnn
                  job: pnn_TT01j2l_EFT_RunII_CMS_scale_j_Regrouped_RelativeBal
                  parameters: [nu_CMS_scale_j_Regrouped_RelativeBal]

jobs: 

  - id: bit_TT01j2l_EFT_RunII_ML4EFT_all_ensemble
    type: bit
    region: SR_RunII
    process: TT01j2l_EFT_RunII
    selection: null
    numba: True
    eft:
        parameters: [ctGRe, ctGIm, ctj8, cQj18, cQu8, ctu8, cQd8, ctd8, cQj38]
    model:
      n_trees: 800
      learning_rate: 0.6
      loss: MSE
      learn_global_score: true
      split_mode: "binned"
      n_bins: 256
      quantile_bins: true
    base_point_choice: "sm" # standard basis points + SM
    runtime:
      n_split: 12
    n_ensemble: 5
    output:
      filename: "bit_TT01j2l_EFT_RunII_ML4EFT_all.pkl"

  - id: bit_TT01j2l_EFT_RunII_ML4EFT_all_alt_basepoints_ensemble
    type: bit
    region: SR_RunII
    process: TT01j2l_EFT_RunII
    selection: null
    numba: True
    eft:
        parameters: [ctGRe, ctGIm, ctj8, cQj18, cQu8, ctu8, cQd8, ctd8, cQj38]
    model:
      n_trees: 800
      learning_rate: 0.6
      loss: MSE
      learn_global_score: true
      split_mode: "binned"
      n_bins: 256
      quantile_bins: true
    base_point_choice: "alt" # alternative basis points to cover more ground close to SM (including SM) 
    runtime:
      n_split: 12
    n_ensemble: 5
    output:
      filename: "bit_TT01j2l_EFT_RunII_ML4EFT_all_alt_basepoints.pkl"

  - id: scaler_TT01j2l_EFT_RunII
    type: scaler
    process: TT01j2l_EFT_RunII
    region: SR_RunII
    selection: null
    output:
      filename: "Scaler_TT01j2l_EFT_RunII.pkl"

  - id: icp_TT01j2l_EFT_RunII_L1Prefire
    type: icp
    region: SR_RunII
    parameters: [nu_l1prefire]
    combinations: [[nu_l1prefire]]
    base_points:
    - coords: [-1.0]
      loader: TT01j2l_EFT_RunII
      removeweights: ["L1PreFiringWeight_Nom"]
      addweights: ["L1PreFiringWeight_Dn"]
    - coords: [0.0]
      loader: TT01j2l_EFT_RunII
      nominal: true
    - coords: [1.0]
      loader: TT01j2l_EFT_RunII
      removeweights: ["L1PreFiringWeight_Nom"]
      addweights: ["L1PreFiringWeight_Up"]
    train_ratio: true
    output:
      filename: icp_TT01j2l_EFT_RunII_L1Prefire.pkl

  - id: pnn_TT01j2l_EFT_RunII_L1Prefire
    type: pnn
    region: SR_RunII
    parameters: [nu_l1prefire]
    combinations: [[nu_l1prefire]]
    base_points:
    - coords: [-1.0]
      loader: TT01j2l_EFT_RunII
      removeweights: ["L1PreFiringWeight_Nom"]
      addweights: ["L1PreFiringWeight_Dn"]
    - coords: [0.0]
      loader: TT01j2l_EFT_RunII
      nominal: true
    - coords: [1.0]
      loader: TT01j2l_EFT_RunII
      removeweights: ["L1PreFiringWeight_Nom"]
      addweights: ["L1PreFiringWeight_Up"]
    model:
      hidden_layers:
      - 128
      - 128
      activation: relu
      initialize_zero: true
    optim:
      epochs: 200
      phaseout_epochs: 50
      learning_rate: 0.001
    runtime:
      n_split: 12
      rebin: 2
    extras:
      use_scaler: scaler_TT01j2l_EFT_RunII
      use_icp: icp_TT01j2l_EFT_RunII_L1Prefire

  - id: icp_TT01j2l_EFT_RunII_PU
