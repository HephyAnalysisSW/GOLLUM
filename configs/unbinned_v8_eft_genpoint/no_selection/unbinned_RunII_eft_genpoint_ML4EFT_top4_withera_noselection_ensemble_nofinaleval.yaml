version: unbinned_v8_eft_genpoint_withera_noselection_nofinaleval

defaults:
  module_samples: "data.samples_eft"
  default_features:
    - TOP_KINEMATICS
    - LEPTON_KINEMATICS
    - ASYMMETRY
    - SPIN_CORRELATION
    - era

  splitting:
    enabled: true
    type: uid
    uid_fields: ["run", "luminosityBlock", "event"]
    seed: 42
    n_buckets: 10000 

    scheme:
      pnn_train:     { fraction: 0.66 }
      pnn_val:       { fraction: 0.14 }
      c2st_train:    { fraction: 0.15 }
      c2st_val:      { fraction: 0.05 }
      final_eval:    { fraction: 0.00 } # using c2st_train and c2st_eval to do the final evals

  early_stopping:
    enabled: true
    patience: 20        # same as current hard-coded
    min_delta: 0.0      # improvement threshold; keep 0.0 to match current behavior
    mode: "min"         # val_loss should decrease
    warmup_epochs: 0    # optional: do not early-stop before this epoch


likelihood:
    regions:
        - id: SR_RunII 
          classifier:
            type: null
            id: null    # no classifier needed for a single process
            asimov: [TT01j2l_EFT_RunII]
          classes: 
            - id: TT01j2l_EFT_RunII
              sample: TT01j2l_EFT_RunII 
              POI:
                job: bit_TT01j2l_EFT_RunII_ML4EFT_top4_ensemble 
                type: bit
                parameters: [ctGRe, ctGIm, cQj18, ctj8]

jobs: 

  - id: bit_TT01j2l_EFT_RunII_ML4EFT_top4_ensemble
    type: bit
    region: SR_RunII
    process: TT01j2l_EFT_RunII
    selection: null
    numba: True
    eft:
        parameters: [ctGRe, ctGIm, cQj18, ctj8]
    model:
      n_trees: 800
      learning_rate: 0.2
      loss: MSE
      learn_global_score: true
      split_mode: "binned"
      n_bins: 256
      quantile_bins: true
    runtime:
      training_plots: true
      n_split: 12
    n_ensemble: 5
    output:
      filename: "bit_TT01j2l_EFT_RunII_ML4EFT_top4.pkl"    

  # going a bit 
  - id: bit_TT01j2l_EFT_RunII_ML4EFT_top4_ensemble_nbins512_minsize25
    type: bit
    region: SR_RunII
    process: TT01j2l_EFT_RunII
    selection: null
    numba: True
    eft:
        parameters: [ctGRe, ctGIm, cQj18, ctj8]
    model:
      n_trees: 800
      learning_rate: 0.2
      loss: MSE
      learn_global_score: true
      split_mode: "binned"
      n_bins: 512
      quantile_bins: true
      min_size: 25
    runtime:
      training_plots: true
      n_split: 12
    n_ensemble: 5
    output:
      filename: "bit_TT01j2l_EFT_RunII_ML4EFT_top4_ensemble_nbins512_minsize25.pkl"    