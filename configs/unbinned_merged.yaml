version: v1

defaults:
  module_samples: "data.samples"     # jobs import datasets/views by name from here
  batch_size: 65536
  default_features: 
    - TOP_KINEMATICS
    - LEPTON_KINEMATICS
    - ASYMMETRY

likelihood:
    regions:
        - id: SR # main signal region
          classifier: 
            type: null
            id: null    # no classifier needed for a single process
            asimov: [tt2l]
          classes:
            - id: tt2l
              sample: tt2l
              POI:
                job: bit_tt2l
                type: bit
                parameters: [c0, c1, c2, c3, c4, c5]
              systematics: 
                - id: Normalization
                  type: lnN
                  value: 0.05 
                  parameters: [nu_norm]
                - id: Trigger
                  type: pnn
                  job: pnn_tt2l_Trigger
                  parameters: [nu_trigger]
                - id: L1Prefire
                  type: pnn
                  job: pnn_tt2l_L1Prefire
                  parameters: [nu_l1prefire]
                - id: PU
                  type: pnn
                  job: pnn_tt2l_PU
                  parameters: [nu_pu]
                - id: LeptonSF
                  type: pnn
                  job: pnn_tt2l_LeptonSF
                  parameters: [nu_leptonsf]
                - id: BTag_b
                  type: pnn
                  job: pnn_tt2l_BTag_b
                  parameters: [nu_btag_b]
                - id: BTag_l
                  type: pnn
                  job: pnn_tt2l_BTag_l
                  parameters: [nu_btag_l]
                - id: Scales
                  type: pnn
                  job: pnn_tt2l_scales
                  parameters: [nu_mu_ren, nu_mu_fac]
                - id: JES
                  type: pnn
                  job: pnn_tt2l_jesTotal
                  parameters: [nu_jes]

jobs:
  - include: bit_merged.yaml
  # -------------------------------
  # Scalers (one per class/view)
  # -------------------------------
  - id: scaler_tt2l
    type: scaler
    process: tt2l
    region: SR
    selection: null
    output:
      filename: "Scaler_tt2l.pkl"

  # -------------------------------
  # ICP (Inclusive Cross-Section Parametrization) for lepton SF (quadratic)
  # Base points: {-1, 0, +1} 
  # -------------------------------
  # =========================
  # Base sample: tt2l
  # =========================
  - id: icp_tt2l_Trigger
    type: icp
    region: SR
    parameters: [nu_trigger]
    combinations: [[nu_trigger]]
    train_ratio: true
    base_points:
      - coords: [-1.0]
        loader: tt2l
        removeweights: ["reweightTrigger"]
        addweights: ["reweightTriggerDown"]
      - coords: [ 0.0]
        loader: tt2l
        nominal: true
      - coords: [ 1.0]
        loader: tt2l
        removeweights: ["reweightTrigger"]
        addweights: ["reweightTriggerUp"]
    output:
      filename: icp_tt2l_Trigger.pkl

  - id: icp_tt2l_L1Prefire
    type: icp
    region: SR
    parameters: [nu_l1prefire]
    combinations: [[nu_l1prefire]]
    base_points:
      - coords: [-1.0]
        loader: tt2l
        removeweights: ["reweightL1Prefire"]
        addweights: ["reweightL1PrefireDown"]
      - coords: [ 0.0]
        loader: tt2l
        nominal: true
      - coords: [ 1.0]
        loader: tt2l
        removeweights: ["reweightL1Prefire"]
        addweights: ["reweightL1PrefireUp"]
    output:
      filename: icp_tt2l_L1Prefire.pkl

  - id: icp_tt2l_PU
    type: icp
    region: SR
    parameters: [nu_pu]
    combinations: [[nu_pu]]
    base_points:
      - coords: [-1.0]
        loader: tt2l
        removeweights: ["reweightPU"]
        addweights: ["reweightPUDown"]
      - coords: [ 0.0]
        loader: tt2l
        nominal: true
      - coords: [ 1.0]
        loader: tt2l
        removeweights: ["reweightPU"]
        addweights: ["reweightPUUp"]
    nominal_index: 1
    output:
      filename: icp_tt2l_PU.pkl

  - id: icp_tt2l_LeptonSF
    type: icp
    region: SR
    parameters: [nu_leptonsf]
    combinations: [[nu_leptonsf]]
    base_points:
      - coords: [-1.0]
        loader: tt2l
        removeweights: ["reweightLeptonSF"]
        addweights: ["reweightLeptonSFDown"]
      - coords: [ 0.0]
        loader: tt2l
        nominal: true
      - coords: [ 1.0]
        loader: tt2l
        removeweights: ["reweightLeptonSF"]
        addweights: ["reweightLeptonSFUp"]
    nominal_index: 1
    output:
      filename: icp_tt2l_LeptonSF.pkl

  - id: icp_tt2l_BTag_b
    type: icp
    region: SR
    parameters: [nu_btag_b]
    combinations: [[nu_btag_b]]
    base_points:
      - coords: [-1.0]
        loader: tt2l
        removeweights: ["reweightBTagSF1a_SF_b"]
        addweights: ["reweightBTagSF1a_SF_b_Down"]
      - coords: [ 0.0]
        loader: tt2l
        nominal: true
      - coords: [ 1.0]
        loader: tt2l
        removeweights: ["reweightBTagSF1a_SF_b"]
        addweights: ["reweightBTagSF1a_SF_b_Up"]
    nominal_index: 1
    output:
      filename: icp_tt2l_BTag_b.pkl

  - id: icp_tt2l_BTag_l
    type: icp
    region: SR
    parameters: [nu_btag_l]
    combinations: [[nu_btag_l]]
    base_points:
      - coords: [-1.0]
        loader: tt2l
        removeweights: ["reweightBTagSF1a_SF_l"]
        addweights: ["reweightBTagSF1a_SF_l_Down"]
      - coords: [ 0.0]
        loader: tt2l
        nominal: true
      - coords: [ 1.0]
        loader: tt2l
        removeweights: ["reweightBTagSF1a_SF_l"]
        addweights: ["reweightBTagSF1a_SF_l_Up"]
    nominal_index: 1
    output:
      filename: icp_tt2l_BTag_l.pkl

  - id: icp_tt2l_scales
    type: icp
    region: SR
    parameters: [nu_mu_ren, nu_mu_fac]
    combinations: [[nu_mu_ren], [nu_mu_fac], [nu_mu_ren, nu_mu_ren], [nu_mu_ren, nu_mu_fac], [nu_mu_fac, nu_mu_fac]]
    base_points:
      - coords: [-1.0, -1.0]
        loader: tt2l
        addweights: ["scale_ren0p5_fac0p5"]
      - coords: [-1.0, 0]
        loader: tt2l
        addweights: ["scale_ren0p5_fac1p0"]
      - coords: [-1.0, 1.0]
        loader: tt2l
        addweights: ["scale_ren0p5_fac2p0"]
      - coords: [0, -1.0]
        loader: tt2l
        addweights: ["scale_ren1p0_fac0p5"]
      - coords: [0, 0]
        loader: tt2l
        addweights: []
        nominal: true
      - coords: [0, 1.0]
        loader: tt2l
        addweights: ["scale_ren1p0_fac2p0"]
      - coords: [1.0, -1.0]
        loader: tt2l
        addweights: ["scale_ren2p0_fac0p5"]
      - coords: [1.0, 0]
        loader: tt2l
        addweights: ["scale_ren2p0_fac1p0"]
      - coords: [1.0, 1.0]
        loader: tt2l
        addweights: ["scale_ren2p0_fac2p0"]
    output:
      filename: icp_tt2l_scales.pkl

  - id: icp_tt2l_jesTotal
    type: icp
    region: SR
    parameters: [nu_jes]
    combinations: [[nu_jes], [nu_jes, nu_jes]]
    base_points:
      - coords: [-2.0]
        loader: tt2l_2p0_jesTotalDown
      - coords: [-1.5]
        loader: tt2l_1p5_jesTotalDown 
      - coords: [-1.0]
        loader: tt2l_1p0_jesTotalDown
      - coords: [-0.5]
        loader: tt2l_0p5_jesTotalDown
      - coords: [0]
        loader: tt2l_jesNominal
        nominal: true
      - coords: [0.5]
        loader: tt2l_0p5_jesTotalUp
      - coords: [1.0]
        loader: tt2l_1p0_jesTotalUp
      - coords: [1.5]
        loader: tt2l_1p5_jesTotalUp
      - coords: [2.0]
        loader: tt2l_2p0_jesTotalUp
    output:
      filename: icp_tt2l_jesTotal.pkl

  # -------------------------------
  # PNN (Parametric NN for local DCR) using the same lSF setup
  # Uses ICP inside the loss/pred via extras.use_icp
  # -------------------------------
  # =========================
  # PNN — base sample: tt2l
  # =========================
  - id: pnn_tt2l_Trigger
    type: pnn
    region: SR
    parameters: [nu_trigger]
    combinations: [[nu_trigger]]
    base_points:
      - coords: [-1.0]
        loader: tt2l
        removeweights: ["reweightTrigger"] 
        addweights: ["reweightTriggerDown"] 
      - coords: [ 0.0]
        loader: tt2l
      - coords: [ 1.0]
        loader: tt2l
        removeweights: ["reweightTrigger"] 
        addweights: ["reweightTriggerUp"] 
    model: { hidden_layers: [128,128], activation: relu, initialize_zero: true }
    optim: { epochs: 200, phaseout_epochs: 50, learning_rate: 0.001 }
    runtime: { n_split: 10, rebin: 2 }
    extras:
      use_scaler: scaler_tt2l
      use_icp: icp_tt2l_Trigger
    output: { filename: "pnn_tt2l_Trigger.pkl" }
  
  - id: pnn_tt2l_L1Prefire
    type: pnn
    region: SR
    parameters: [nu_l1prefire]
    combinations: [[nu_l1prefire]]
    base_points:
      - coords: [-1.0]
        loader: tt2l
        removeweights: ["reweightL1Prefire"] 
        addweights: ["reweightL1PrefireDown"] 
      - coords: [ 0.0]
        loader: tt2l
      - coords: [ 1.0]
        loader: tt2l
        removeweights: ["reweightL1Prefire"] 
        addweights: ["reweightL1PrefireUp"] 
    model: { hidden_layers: [128,128], activation: relu, initialize_zero: true }
    optim: { epochs: 200, phaseout_epochs: 50, learning_rate: 0.001 }
    runtime: { n_split: 10, rebin: 2 }
    extras:
      use_scaler: scaler_tt2l
      use_icp: icp_tt2l_L1Prefire
    output: { filename: "pnn_tt2l_L1Prefire.pkl" }
  
  - id: pnn_tt2l_PU
    type: pnn
    region: SR
    parameters: [nu_pu]
    combinations: [[nu_pu]]
    base_points:
      - coords: [-1.0]
        loader: tt2l
        removeweights: ["reweightPU"] 
        addweights: ["reweightPUDown"] 
      - coords: [ 0.0]
        loader: tt2l
      - coords: [ 1.0]
        loader: tt2l
        removeweights: ["reweightPU"] 
        addweights: ["reweightPUUp"] 
    model: { hidden_layers: [128,128], activation: relu, initialize_zero: true }
    optim: { epochs: 200, phaseout_epochs: 50, learning_rate: 0.001 }
    runtime: { n_split: 10, rebin: 2 }
    extras:
      use_scaler: scaler_tt2l
      use_icp: icp_tt2l_PU
    output: { filename: "pnn_tt2l_PU.pkl" }

 
  - id: pnn_tt2l_LeptonSF
    type: pnn
    region: SR
    parameters: [nu_leptonsf]
    combinations: [[nu_leptonsf]]
    base_points:
      - coords: [-1.0]
        loader: tt2l
        removeweights: ["reweightLeptonSF"] 
        addweights: ["reweightLeptonSFDown"] 
      - coords: [ 0.0]
        loader: tt2l
      - coords: [ 1.0]
        loader: tt2l
        removeweights: ["reweightLeptonSF"] 
        addweights: ["reweightLeptonSFUp"] 
    model: { hidden_layers: [128,128], activation: relu, initialize_zero: true }
    optim: { epochs: 200, phaseout_epochs: 50, learning_rate: 0.001 }
    runtime: { n_split: 10, rebin: 2 }
    extras:
      use_scaler: scaler_tt2l
      use_icp: icp_tt2l_LeptonSF
    output: { filename: "pnn_tt2l_LeptonSF.pkl" }
  
  - id: pnn_tt2l_BTag_b
    type: pnn
    region: SR
    parameters: [nu_btag_b]
    combinations: [[nu_btag_b]]
    base_points:
      - coords: [-1.0]
        loader: tt2l
        removeweights: ["reweightBTagSF1a_SF"] 
        addweights: ["reweightBTagSF1a_SF_b_Down"] 
      - coords: [ 0.0]
        loader: tt2l
      - coords: [ 1.0]
        loader: tt2l
        removeweights: ["reweightBTagSF1a_SF"] 
        addweights: ["reweightBTagSF1a_SF_b_Up"] 
    model: { hidden_layers: [128,128], activation: relu, initialize_zero: true }
    optim: { epochs: 200, phaseout_epochs: 50, learning_rate: 0.001 }
    runtime: { n_split: 10, rebin: 2 }
    extras:
      use_scaler: scaler_tt2l
      use_icp: icp_tt2l_BTag_b
    output: { filename: "pnn_tt2l_BTag_b.pkl" }
  
  - id: pnn_tt2l_BTag_l
    type: pnn
    region: SR
    parameters: [nu_btag_l]
    combinations: [[nu_btag_l]]
    base_points:
      - coords: [-1.0]
        loader: tt2l
        removeweights: ["reweightBTagSF1a_SF"] 
        addweights: ["reweightBTagSF1a_SF_l_Down"] 
      - coords: [ 0.0]
        loader: tt2l
      - coords: [ 1.0]
        loader: tt2l
        removeweights: ["reweightBTagSF1a_SF"] 
        addweights: ["reweightBTagSF1a_SF_l_Up"] 
    model: { hidden_layers: [128,128], activation: relu, initialize_zero: true }
    optim: { epochs: 200, phaseout_epochs: 50, learning_rate: 0.001 }
    runtime: { n_split: 10, rebin: 2 }
    extras:
      use_scaler: scaler_tt2l
      use_icp: icp_tt2l_BTag_l
    output: { filename: "pnn_tt2l_BTag_l.pkl" }

  - id: pnn_tt2l_scales
    type: pnn
    region: SR
    parameters: [nu_mu_ren, nu_mu_fac]
    combinations: [[nu_mu_ren], [nu_mu_fac], [nu_mu_ren, nu_mu_ren], [nu_mu_ren, nu_mu_fac], [nu_mu_fac, nu_mu_fac]]
    base_points:
      - coords: [-1.0, -1.0]
        loader: tt2l
        addweights: ["scale_ren0p5_fac0p5"]
      - coords: [-1.0, 0]
        loader: tt2l
        addweights: ["scale_ren0p5_fac1p0"]
      - coords: [-1.0, 1.0]
        loader: tt2l
        addweights: ["scale_ren0p5_fac2p0"]
      - coords: [0, -1.0]
        loader: tt2l
        addweights: ["scale_ren1p0_fac0p5"]
      - coords: [0, 0]
        loader: tt2l
        addweights: ["scale_ren1p0_fac1p0"]
      - coords: [0, 1.0]
        loader: tt2l
        addweights: ["scale_ren1p0_fac2p0"]
      - coords: [1.0, -1.0]
        loader: tt2l
        addweights: ["scale_ren2p0_fac0p5"]
      - coords: [1.0, 0]
        loader: tt2l
        addweights: ["scale_ren2p0_fac1p0"]
      - coords: [1.0, 1.0]
        loader: tt2l
        addweights: ["scale_ren2p0_fac2p0"]
    model: { hidden_layers: [128,128], activation: relu, initialize_zero: true }
    optim: { epochs: 200, phaseout_epochs: 50, learning_rate: 0.001 }
    runtime: { n_split: 10, rebin: 2 }
    extras:
      use_scaler: scaler_tt2l
      use_icp: icp_tt2l_scales
    output: { filename: "pnn_tt2l_scales.pkl" }

  - id: pnn_tt2l_jesTotal
    type: pnn
    region: SR
    parameters: [nu_jes]
    combinations: [[nu_jes], [nu_jes, nu_jes]]
    base_points:
      #- coords: [-2.0]
      #  loader: tt2l_2p0_jesTotalDown
      #- coords: [-1.5]
      #  loader: tt2l_1p5_jesTotalDown 
      - coords: [-1.0]
        loader: tt2l_1p0_jesTotalDown
      #- coords: [-0.5]
      #  loader: tt2l_0p5_jesTotalDown
      - coords: [0]
        loader: tt2l_jesNominal
      #- coords: [0.5]
      #  loader: tt2l_0p5_jesTotalUp
      - coords: [1.0]
        loader: tt2l_1p0_jesTotalUp
      #- coords: [1.5]
      #  loader: tt2l_1p5_jesTotalUp
      #- coords: [2.0]
      #  loader: tt2l_2p0_jesTotalUp
    model: { hidden_layers: [128,128], activation: relu, initialize_zero: true }
    optim: { epochs: 200, phaseout_epochs: 50, learning_rate: 0.001 }
    runtime: { n_split: 10, rebin: 2 }
    extras:
      use_scaler: scaler_tt2l
      use_icp: icp_tt2l_jesTotal
    output: { filename: "pnn_tt2l_jesTotal.pkl" }
