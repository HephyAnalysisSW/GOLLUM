      (dilep_pt < 350) &  (dilep_dEta < 4) & (bjet0_pt < 500) & (bjet1_pt < 300) & (lep0_pt < 350)
      & (lep1_pt < 300) & (max_obj_pair_pt < 600) & (nSelJet <= 5) & (pseudo_mtt < 1300)
    numba: True
    eft:
