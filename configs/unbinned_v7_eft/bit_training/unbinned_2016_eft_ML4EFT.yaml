version: unbinned_v7_eft_ML4EFT

defaults:
  module_samples: "data.samples_eft"
  default_features:
    - ML4EFT_VARIABLES

  selection: >
    (dibjet_mass < 1000) & (dibjet_pt < 700) & (dilep_mass < 800) &
    (dilep_pt < 400) && (bjet0_pt < 800) & (bjet1_pt < 500) & (lep0_pt < 350)
    & (lep1_pt < 350)

  selection_features:
    - dibjet_mass
    - dibjet_pt
    - dibjet_deta
    - dilep_mass
    - dilep_pt
    - dilep_deta
    - bjet0_pt
    - bjet1_pt
    - lep0_pt
    - lep1_pt
    - max_obj_pair_pt
    - nSelJet
    - pseudo_mtt

  splitting:
    enabled: true
    type: uid
    uid_fields: ["run", "luminosityBlock", "event"]
    seed: 42
    n_buckets: 10000 

    scheme:
      pnn_train:     { fraction: 0.50 }
      pnn_val:       { fraction: 0.10 }
      c2st_train:    { fraction: 0.15 }
      c2st_val:      { fraction: 0.05 }
      final_eval:    { fraction: 0.20 }

  early_stopping:
    enabled: true
    patience: 20        # same as current hard-coded
    min_delta: 0.0      # improvement threshold; keep 0.0 to match current behavior
    mode: "min"         # val_loss should decrease
    warmup_epochs: 0    # optional: do not early-stop before this epoch


likelihood:
    regions:
        - id: SR_2016 
          classifier:
            type: null
            id: null    # no classifier needed for a single process
            asimov: [TT01j2l_EFT_2016]
          classes: 
            - id: tt2l_gen
              sample: TT01j2l_EFT_2016 
              POI:
                job: bit_TT01j2l_EFT_2016 
                type: bit
                parameters: [ctGRe, ctGIm, cQd1]

jobs:
  - id: bit_TT01j2l_EFT_2016 
    type: bit
    region: SR_2016
    process: TT01j2l_EFT_2016 
    selection: null               # optional extra selection layered on top
    numba: True
    eft:
        parameters: [ctGRe, ctGIm, cQd1]
    model:
      n_trees: 400
      learning_rate: 0.2
      loss: MSE                   # or "CrossEntropy"
      learn_global_score: true
      split_mode: "binned"
      n_bins: 256
      quantile_bins: true  # if True: quantile edges; else uniform edges
    runtime:
      training_plots: true        # keep if you want training plots
    output:
      filename: "bit_TT01j2l_EFT_2016.pkl"

  - id: bit_TT01j2l_EFT_2016_allWC
    type: bit
    region: SR_2016
    process: TT01j2l_EFT_2016
    selection: null
    numba: True
    eft:
        parameters: [cQd1, ctj1, cQj31, ctj8, ctd1, ctd8, ctGRe, ctGIm, cQj11, cQj18, ctu8, cQd8, ctu1, cQu1, cQj38, cQu8]
    model:
