version: binned_v8

defaults:
  module_samples: "data.samples_RunII"
  default_binning:
    - ["tr_ttbar_mass", [300, 400, 500, 650, 1500]]
    - ["tr_ttbar_y", [-2.5, -1.2, -0.8, -0.4, 0.4, 0.8, 1.2, 2.5]]

likelihood:
    binned:
        - id: SR_2018
          data:
            id: Data_2018
            sample: Data_2018         
          classes: 
            - id: TTLep_pow_2018 
              sample: TTLep_pow_2018
              POI:
                job: ich_NG_PDF4LHC21_6_TTLep_pow_2018 
                type: ich
                parameters: [c0, c1, c2, c3, c4, c5]
              systematics:
                - id: signal_strength
                  type: lnN
                  value: 0.036 # twice the relative uncertainty on the ATLAS measurement
                  parameters: [nu_norm_ttbar]
                  floating: true               
                - id: Lumi_15161718
                  type: lnN
                  value: 0.0084              
                  parameters: [nu_lumi_15161718]               
                - id: L1Prefire
                  type: icph
                  job: icph_TTLep_pow_2018_L1Prefire
                  parameters: [nu_l1prefire]
                - id: PU
                  type: icph
                  job: icph_TTLep_pow_2018_PU
                  parameters: [nu_pu]
                - id: MuSF 
                  type: icph
                  job: icph_TTLep_pow_2018_MuSF
                  parameters: [nu_MuSF]
                - id: EleSF
                  type: icph
                  job: icph_TTLep_pow_2018_EleSF
                  parameters: [nu_EleSF]
                - id: BTag_b
