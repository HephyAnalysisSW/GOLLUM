  - id: icph_TTLep_pow_2018_scales
    type: icph
    region: SR_2018
    parameters: [nu_mu_ren, nu_mu_fac]
    combinations: [[nu_mu_ren], [nu_mu_fac], [nu_mu_ren, nu_mu_ren], [nu_mu_ren, nu_mu_fac], [nu_mu_fac, nu_mu_fac]]
    base_points:
      - coords: [-1.0, -1.0]
        loader: TTLep_pow_2018
        addweights: ["scale_ren0p5_fac0p5"]
      - coords: [-1.0, 0]
        loader: TTLep_pow_2018
        addweights: ["scale_ren0p5_fac1p0"]
      - coords: [-1.0, 1.0]
        loader: TTLep_pow_2018
        addweights: ["scale_ren0p5_fac2p0"]
      - coords: [0, -1.0]
        loader: TTLep_pow_2018
        addweights: ["scale_ren1p0_fac0p5"]
      - coords: [0, 0]
        loader: TTLep_pow_2018
        addweights: ["scale_ren1p0_fac1p0"]
        nominal: true
      - coords: [0, 1.0]
        loader: TTLep_pow_2018
        addweights: ["scale_ren1p0_fac2p0"]
      - coords: [1.0, -1.0]
        loader: TTLep_pow_2018
        addweights: ["scale_ren2p0_fac0p5"]
      - coords: [1.0, 0]
