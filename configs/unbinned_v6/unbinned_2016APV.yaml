                  job: pnn_TTLep_pow_2016APV_showerISR
                  parameters: [nu_showerISR]
                - id: ShowerFSR
                  type: pnn
                  job: pnn_TTLep_pow_2016APV_showerFSR
                  parameters: [nu_showerFSR]
                - id: AlphaS
