version: binned_v8_eft_genpoint_noselection_2D_mtt_pttt

defaults:
  module_samples: "data.samples_eft"
  # combination of 1D binnings from HEPData of TOP-20-006
  default_binning:
    - ["tr_ttbar_mass", [300, 380, 470, 620, 820, 1100, 1500, 2500]]
    - ["tr_ttbar_pt", [0, 55, 100, 165, 240, 330, 440, 600]]

likelihood:
    binned:
        - id: SR_RunII     
          classes: 
            - id: TT01j2l_EFT_RunII 
              sample: TT01j2l_EFT_RunII
              POI:
                job: ich_TT01j2l_EFT_RunII_ML4EFT_all 
                type: ich
                parameters: [ctGRe, ctGIm, ctj8, cQj18, cQu8, ctu8, cQd8, ctd8, cQj38]

              systematics:                     
                - id: PU
                  type: icph
                  job: icph_TT01j2l_EFT_RunII_PU
                  parameters: [nu_pu]
                - id: MuSF 
                  type: icph
                  job: icph_TT01j2l_EFT_RunII_MuSF
                  parameters: [nu_MuSF]
                - id: EleSF
                  type: icph
                  job: icph_TT01j2l_EFT_RunII_EleSF
                  parameters: [nu_EleSF]
                - id: BTag_b
                  type: icph
                  job: icph_TT01j2l_EFT_RunII_BTag_b
                  parameters: [nu_btag_b]
                - id: BTag_l
                  type: icph
                  job: icph_TT01j2l_EFT_RunII_BTag_l
                  parameters: [nu_btag_l]
                - id: Scales
                  type: icph
                  job: icph_TT01j2l_EFT_RunII_scales
                  parameters: [nu_mu_ren, nu_mu_fac]
                - id: CMS_scale_j_FlavorPureBottom
                  type: icph
                  job: icph_TT01j2l_EFT_RunII_CMS_scale_j_FlavorPureBottom
                  parameters: [nu_CMS_scale_j_FlavorPureBottom]
                - id: CMS_scale_j_FlavorPureCharm
                  type: icph
                  job: icph_TT01j2l_EFT_RunII_CMS_scale_j_FlavorPureCharm
                  parameters: [nu_CMS_scale_j_FlavorPureCharm]
                - id: CMS_scale_j_FlavorPureGluon
                  type: icph
                  job: icph_TT01j2l_EFT_RunII_CMS_scale_j_FlavorPureGluon
                  parameters: [nu_CMS_scale_j_FlavorPureGluon]
                - id: CMS_scale_j_FlavorPureQuark
                  type: icph
                  job: icph_TT01j2l_EFT_RunII_CMS_scale_j_FlavorPureQuark
                  parameters: [nu_CMS_scale_j_FlavorPureQuark]
                - id: CMS_scale_j_Regrouped_Absolute
                  type: icph
                  job: icph_TT01j2l_EFT_RunII_CMS_scale_j_Regrouped_Absolute
                  parameters: [nu_CMS_scale_j_Regrouped_Absolute]
                - id: CMS_scale_j_Regrouped_BBEC1
                  type: icph
                  job: icph_TT01j2l_EFT_RunII_CMS_scale_j_Regrouped_BBEC1
                  parameters: [nu_CMS_scale_j_Regrouped_BBEC1]
                - id: CMS_scale_j_Regrouped_EC2
                  type: icph
                  job: icph_TT01j2l_EFT_RunII_CMS_scale_j_Regrouped_EC2
                  parameters: [nu_CMS_scale_j_Regrouped_EC2]
                - id: CMS_scale_j_Regrouped_HF
                  type: icph
                  job: icph_TT01j2l_EFT_RunII_CMS_scale_j_Regrouped_HF
                  parameters: [nu_CMS_scale_j_Regrouped_HF]
                - id: CMS_scale_j_Regrouped_RelativeBal
                  type: icph
                  job: icph_TT01j2l_EFT_RunII_CMS_scale_j_Regrouped_RelativeBal
                  parameters: [nu_CMS_scale_j_Regrouped_RelativeBal]

jobs:
  - id: ich_TT01j2l_EFT_RunII_ML4EFT_all
    type: ich
    region: SR_RunII
    process: TT01j2l_EFT_RunII
    eft:
      parameters: [ctGRe, ctGIm, ctj8, cQj18, cQu8, ctu8, cQd8, ctd8, cQj38]
   
  - id: icph_TT01j2l_EFT_RunII_L1Prefire
    type: icph
    region: SR_RunII
    parameters: [nu_l1prefire]
    combinations: [[nu_l1prefire]]
    base_points:
      - coords: [-1.0]
        loader: TT01j2l_EFT_RunII
        removeweights: ["L1PreFiringWeight_Nom"] 
        addweights: ["L1PreFiringWeight_Dn"] 
      - coords: [ 0.0]
        loader: TT01j2l_EFT_RunII
        nominal: true
      - coords: [ 1.0]
        loader: TT01j2l_EFT_RunII
        removeweights: ["L1PreFiringWeight_Nom"] 
        addweights: ["L1PreFiringWeight_Up"] 
  
  - id: icph_TT01j2l_EFT_RunII_PU
    type: icph
    region: SR_RunII
    parameters: [nu_pu]
    combinations: [[nu_pu]]
    base_points:
      - coords: [-1.0]
        loader: TT01j2l_EFT_RunII
        removeweights: ["Pileup_SF"] 
        addweights: ["Pileup_SFDn"] 
      - coords: [ 0.0]
        loader: TT01j2l_EFT_RunII
        nominal: true
      - coords: [ 1.0]
        loader: TT01j2l_EFT_RunII
        removeweights: ["Pileup_SF"] 
        addweights: ["Pileup_SFUp"] 

  - id: icph_TT01j2l_EFT_RunII_MuSF 
    type: icph
    region: SR_RunII
    parameters: [nu_MuSF]
    combinations: [[nu_MuSF]]
    base_points:
      - coords: [-1.0]
        loader: TT01j2l_EFT_RunII
        removeweights: ["lepMu_SF"] 
        addweights: ["lepMu_SFDn"] 
      - coords: [ 0.0]
        loader: TT01j2l_EFT_RunII
        nominal: true
      - coords: [ 1.0]
        loader: TT01j2l_EFT_RunII
        removeweights: ["lepMu_SF"] 
        addweights: ["lepMu_SFUp"] 

  - id: icph_TT01j2l_EFT_RunII_EleSF 
    type: icph
    region: SR_RunII
    parameters: [nu_EleSF]
    combinations: [[nu_EleSF]]
    base_points:
      - coords: [-1.0]
        loader: TT01j2l_EFT_RunII
        removeweights: ["lepEle_SF"] 
        addweights: ["lepEle_SFDn"] 
      - coords: [ 0.0]
        loader: TT01j2l_EFT_RunII
        nominal: true
      - coords: [ 1.0]
        loader: TT01j2l_EFT_RunII
        removeweights: ["lepEle_SF"] 
        addweights: ["lepEle_SFUp"] 
  
  - id: icph_TT01j2l_EFT_RunII_BTag_b
    type: icph
    region: SR_RunII
    parameters: [nu_btag_b]
    combinations: [[nu_btag_b]]
    base_points:
      - coords: [-1.0]
        loader: TT01j2l_EFT_RunII
        removeweights: ["btagSF_fixedWP_SF"] 
        addweights: ["btagSF_fixedWP_SF__CMS_eff_b_correlated_heavy_SFDn"] 
      - coords: [ 0.0]
        loader: TT01j2l_EFT_RunII
        nominal: true
      - coords: [ 1.0]
        loader: TT01j2l_EFT_RunII
        removeweights: ["btagSF_fixedWP_SF"] 
        addweights: ["btagSF_fixedWP_SF__CMS_eff_b_correlated_heavy_SFUp"] 
  
  - id: icph_TT01j2l_EFT_RunII_BTag_l
    type: icph
    region: SR_RunII
    parameters: [nu_btag_l]
    combinations: [[nu_btag_l]]
    base_points:
      - coords: [-1.0]
        loader: TT01j2l_EFT_RunII
        removeweights: ["btagSF_fixedWP_SF"] 
        addweights: ["btagSF_fixedWP_SF__CMS_eff_b_light_SFDn"] 
      - coords: [ 0.0]
        loader: TT01j2l_EFT_RunII
        nominal: true
      - coords: [ 1.0]
        loader: TT01j2l_EFT_RunII
        removeweights: ["btagSF_fixedWP_SF"] 
        addweights: ["btagSF_fixedWP_SF__CMS_eff_b_light_SFUp"] 

  - id: icph_TT01j2l_EFT_RunII_scales
    type: icph
    region: SR_RunII
    parameters: [nu_mu_ren, nu_mu_fac]
    combinations: [[nu_mu_ren], [nu_mu_fac], [nu_mu_ren, nu_mu_ren], [nu_mu_ren, nu_mu_fac], [nu_mu_fac, nu_mu_fac]]
    base_points:
      - coords: [-1.0, -1.0]
        loader: TT01j2l_EFT_RunII
        addweights: ["scale_ren0p5_fac0p5"]
      - coords: [-1.0, 0]
        loader: TT01j2l_EFT_RunII
        addweights: ["scale_ren0p5_fac1p0"]
      - coords: [-1.0, 1.0]
        loader: TT01j2l_EFT_RunII
        addweights: ["scale_ren0p5_fac2p0"]
      - coords: [0, -1.0]
        loader: TT01j2l_EFT_RunII
        addweights: ["scale_ren1p0_fac0p5"]
      - coords: [0, 0]
        loader: TT01j2l_EFT_RunII
        addweights: ["scale_ren1p0_fac1p0"]
        nominal: true
      - coords: [0, 1.0]
        loader: TT01j2l_EFT_RunII
        addweights: ["scale_ren1p0_fac2p0"]
      - coords: [1.0, -1.0]
        loader: TT01j2l_EFT_RunII
        addweights: ["scale_ren2p0_fac0p5"]
      - coords: [1.0, 0]
        loader: TT01j2l_EFT_RunII
        addweights: ["scale_ren2p0_fac1p0"]
      - coords: [1.0, 1.0]
        loader: TT01j2l_EFT_RunII
        addweights: ["scale_ren2p0_fac2p0"]

  - id: icph_TT01j2l_EFT_RunII_showerISR
    type: icph
    region: SR_RunII
    parameters: [nu_showerISR]
    combinations: [[nu_showerISR], [nu_showerISR, nu_showerISR]]
    base_points:
      - coords: [-1.0]
        loader: TT01j2l_EFT_RunII
        addweights: ["shower_isr0p5_fsr1p0"]
      - coords: [0]
        loader: TT01j2l_EFT_RunII
        nominal: true
      - coords: [1.0]
        loader: TT01j2l_EFT_RunII
