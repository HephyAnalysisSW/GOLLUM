version: v1

defaults:
  module_samples: "data.samples"     # jobs import datasets/views by name from here
  batch_size: 65536
  default_features: 
    - TOP_KINEMATICS
    - LEPTON_KINEMATICS
    - ASYMMETRY

likelihood:
    regions:
        - id: SR # main signal region
          classifier: 
            type: tfmc
            job: tfmc_split_processes 
            asimov: [tt2l]
          classes: # Warning! The classes here must be in the same order as the output nodes of the tfmc
            - id: tt2l_GG
              POI:
                job: bit_tt2l_GG
                type: bit
                parameters: [c0, c1, c2, c3, c4, c5]
              systematics:
                - id: Normalization_GG
                  type: lnN
                  value: 0.05
                  parameters: [nu_norm_GG]
                - id: Trigger
                  type: pnn
                  job: pnn_tt2l_GG_Trigger
                  parameters: [nu_trigger]
                - id: L1Prefire
                  type: pnn
                  job: pnn_tt2l_GG_L1Prefire
                  parameters: [nu_l1prefire]
                - id: PU
                  type: pnn
                  job: pnn_tt2l_GG_PU
                  parameters: [nu_pu]
                - id: LeptonSF
                  type: pnn
                  job: pnn_tt2l_GG_LeptonSF
                  parameters: [nu_leptonsf]
                - id: BTag_b
                  type: pnn
                  job: pnn_tt2l_GG_BTag_b
                  parameters: [nu_btag_b]
                - id: BTag_l
                  type: pnn
                  job: pnn_tt2l_GG_BTag_l
                  parameters: [nu_btag_l]
            - id: tt2l_QG
              POI:
                job: bit_tt2l_QG
                type: bit
                parameters: [c0, c1, c2, c3, c4, c5]
              systematics:
                - id: Normalization_QG
                  type: lnN
                  value: 0.05
                  parameters: [nu_norm_QG]
                - id: Trigger
                  type: pnn
                  job: pnn_tt2l_QG_Trigger
                  parameters: [nu_trigger]
                - id: L1Prefire
                  type: pnn
                  job: pnn_tt2l_QG_L1Prefire
                  parameters: [nu_l1prefire]
                - id: PU
                  type: pnn
                  job: pnn_tt2l_QG_PU
                  parameters: [nu_pu]
                - id: LeptonSF
                  type: pnn
                  job: pnn_tt2l_QG_LeptonSF
                  parameters: [nu_leptonsf]
                - id: BTag_b
                  type: pnn
                  job: pnn_tt2l_QG_BTag_b
                  parameters: [nu_btag_b]
                - id: BTag_l
                  type: pnn
                  job: pnn_tt2l_QG_BTag_l
                  parameters: [nu_btag_l]
            - id: tt2l_QQ
              POI:
                job: bit_tt2l_QQ
                type: bit
                parameters: [c0, c1, c2, c3, c4, c5]
              systematics:
                - id: Normalization_QQ
                  type: lnN
                  value: 0.05
                  parameters: [nu_norm_QQ]
                - id: Trigger
                  type: pnn
                  job: pnn_tt2l_QQ_Trigger
                  parameters: [nu_trigger]
                - id: L1Prefire
                  type: pnn
                  job: pnn_tt2l_QQ_L1Prefire
                  parameters: [nu_l1prefire]
                - id: PU
                  type: pnn
                  job: pnn_tt2l_QQ_PU
                  parameters: [nu_pu]
                - id: LeptonSF
                  type: pnn
                  job: pnn_tt2l_QQ_LeptonSF
                  parameters: [nu_leptonsf]
                - id: BTag_b
                  type: pnn
                  job: pnn_tt2l_QQ_BTag_b
                  parameters: [nu_btag_b]
                - id: BTag_l
                  type: pnn
                  job: pnn_tt2l_QQ_BTag_l
                  parameters: [nu_btag_l]

jobs:
  - include: bit_split.yaml
  # -------------------------------
  # Inclusive Cross Section (IC)
  # -------------------------------
  - id: ic_tt2l
    type: ic
    region: SR
    process: tt2l
    selection: null
    output:
      filename: "IC_tt2l.pkl"
  - id: ic_tt2l_GG
    type: ic
    region: SR
    process: tt2l_GG
    selection: null
    output:
      filename: "IC_tt2l_GG.pkl"

  - id: ic_tt2l_QG
    type: ic
    region: SR
    process: tt2l_QG
    selection: null
    output:
      filename: "IC_tt2l_QG.pkl"

  - id: ic_tt2l_QQ
    type: ic
    region: SR
    process: tt2l_QQ
    selection: null
    output:
      filename: "IC_tt2l_QQ.pkl"

  # -------------------------------
  # Scalers 
  # -------------------------------
  - id: scaler_tt2l
    type: scaler
    region: SR
    process: tt2l
    selection: null
    output:
      filename: "Scaler_tt2l.pkl"

  - id: scaler_tt2l_GG
    type: scaler
    region: SR
    process: tt2l_GG
    selection: null
    output:
      filename: "Scaler_tt2l_GG.pkl"

  - id: scaler_tt2l_QG
    type: scaler
    region: SR
    process: tt2l_QG
    selection: null
    output:
      filename: "Scaler_tt2l_QG.pkl"

  - id: scaler_tt2l_QQ
    type: scaler
    region: SR
    process: tt2l_QQ
    selection: null
    output:
      filename: "Scaler_tt2l_QQ.pkl"

  # -------------------------------
  # TFMC classifier (split processes)
  # -------------------------------
  - id: tfmc_split_processes
    type: classifier
    region: SR
    framework: "tfmc"
    data:
      classes: [tt2l_GG, tt2l_QG, tt2l_QQ]
    model:
      activation: relu
      hidden_layers: [128, 128]
    optim:
      epochs: 500
      phaseout_epochs: 0
      learning_rate: 0.02
    runtime:
      batch_size: 65536
      num_workers: 1
      seed: 1
    extras:
      use_ic: ic_tt2l
      use_scaler: scaler_tt2l
    output:
      filename: "tfmc_no_reg.pkl"

  # -------------------------------
  # ICP (Inclusive Cross-Section Parametrization) for lepton SF (quadratic)
  # Base points: {-1, 0, +1} using GG views
  # -------------------------------

  - id: icp_tt2l_GG_Trigger
    type: icp
    region: SR
    parameters: [nu_trigger]
    combinations: [[nu_trigger]]
    train_ratio: true
    base_points:
      - coords: [-1.0]
        loader: tt2l_GG
        removeweights: ["reweightTrigger"]
        addweights: ["reweightTriggerDown"]
      - coords: [ 0.0]
        loader: tt2l_GG
        nominal: true
      - coords: [ 1.0]
        loader: tt2l_GG
        removeweights: ["reweightTrigger"]
        addweights: ["reweightTriggerUp"]
    output:
      filename: icp_tt2l_GG_Trigger.pkl

  - id: icp_tt2l_GG_L1Prefire
    type: icp
    region: SR
    parameters: [nu_l1prefire]
    combinations: [[nu_l1prefire]]
    base_points:
      - coords: [-1.0]
        loader: tt2l_GG
        removeweights: ["reweightL1Prefire"]
        addweights: ["reweightL1PrefireDown"]
      - coords: [ 0.0]
        loader: tt2l_GG
        nominal: true
      - coords: [ 1.0]
        loader: tt2l_GG
        removeweights: ["reweightL1Prefire"]
        addweights: ["reweightL1PrefireUp"]
    output:
      filename: icp_tt2l_GG_L1Prefire.pkl

  - id: icp_tt2l_GG_PU
    type: icp
    region: SR
    parameters: [nu_pu]
    combinations: [[nu_pu]]
    base_points:
      - coords: [-1.0]
        loader: tt2l_GG
        removeweights: ["reweightPU"]
        addweights: ["reweightPUDown"]
      - coords: [ 0.0]
        loader: tt2l_GG
        nominal: true
      - coords: [ 1.0]
        loader: tt2l_GG
        removeweights: ["reweightPU"]
        addweights: ["reweightPUUp"]
    nominal_index: 1
    output:
      filename: icp_tt2l_GG_PU.pkl

  - id: icp_tt2l_GG_LeptonSF
    type: icp
    region: SR
    parameters: [nu_leptonsf]
    combinations: [[nu_leptonsf]]
    base_points:
      - coords: [-1.0]
        loader: tt2l_GG
        removeweights: ["reweightLeptonSF"]
        addweights: ["reweightLeptonSFDown"]
      - coords: [ 0.0]
        loader: tt2l_GG
        nominal: true
      - coords: [ 1.0]
        loader: tt2l_GG
        removeweights: ["reweightLeptonSF"]
        addweights: ["reweightLeptonSFUp"]
    nominal_index: 1
    output:
      filename: icp_tt2l_GG_LeptonSF.pkl

  - id: icp_tt2l_GG_BTag_b
    type: icp
    region: SR
    parameters: [nu_btag_b]
    combinations: [[nu_btag_b]]
    base_points:
      - coords: [-1.0]
        loader: tt2l_GG
        removeweights: ["reweightBTagSF1a_SF_b"]
        addweights: ["reweightBTagSF1a_SF_b_Down"]
      - coords: [ 0.0]
        loader: tt2l_GG
        nominal: true
      - coords: [ 1.0]
        loader: tt2l_GG
        removeweights: ["reweightBTagSF1a_SF_b"]
        addweights: ["reweightBTagSF1a_SF_b_Up"]
    nominal_index: 1
    output:
      filename: icp_tt2l_GG_BTag_b.pkl

  - id: icp_tt2l_GG_BTag_l
    type: icp
    region: SR
    parameters: [nu_btag_l]
    combinations: [[nu_btag_l]]
    base_points:
      - coords: [-1.0]
        loader: tt2l_GG
        removeweights: ["reweightBTagSF1a_SF_l"]
        addweights: ["reweightBTagSF1a_SF_l_Down"]
      - coords: [ 0.0]
        loader: tt2l_GG
        nominal: true
      - coords: [ 1.0]
        loader: tt2l_GG
        removeweights: ["reweightBTagSF1a_SF_l"]
        addweights: ["reweightBTagSF1a_SF_l_Up"]
    nominal_index: 1
    output:
      filename: icp_tt2l_GG_BTag_l.pkl

  - id: icp_tt2l_GG_scales
    type: icp
    region: SR
    parameters: [nu_mu_ren, nu_mu_fac]
    combinations: [[nu_mu_ren], [nu_mu_fac], [nu_mu_ren, nu_mu_ren], [nu_mu_ren, nu_mu_fac], [nu_mu_fac, nu_mu_fac]]
    base_points:
      - coords: [-1.0, -1.0]
        loader: tt2l_GG
        addweights: ["scale_ren0p5_fac0p5"]
      - coords: [-1.0, 0]
        loader: tt2l_GG
        addweights: ["scale_ren0p5_fac1p0"]
      - coords: [-1.0, 1.0]
        loader: tt2l_GG
        addweights: ["scale_ren0p5_fac2p0"]
      - coords: [0, -1.0]
        loader: tt2l_GG
        addweights: ["scale_ren1p0_fac0p5"]
      - coords: [0, 0]
        loader: tt2l_GG
        addweights: []
        nominal: true
      - coords: [0, 1.0]
        loader: tt2l_GG
        addweights: ["scale_ren1p0_fac2p0"]
      - coords: [1.0, -1.0]
        loader: tt2l_GG
        addweights: ["scale_ren2p0_fac0p5"]
      - coords: [1.0, 0]
        loader: tt2l_GG
        addweights: ["scale_ren2p0_fac1p0"]
      - coords: [1.0, 1.0]
        loader: tt2l_GG
        addweights: ["scale_ren2p0_fac2p0"]
    output:
      filename: icp_tt2l_GG_scales.pkl

  - id: icp_tt2l_GG_jesTotal
    type: icp
    region: SR
    parameters: [nu_jes]
    combinations: [[nu_jes], [nu_jes, nu_jes]]
    base_points:
      - coords: [-2.0]
        loader: tt2l_GG_2p0_jesTotalDown
      - coords: [-1.5]
        loader: tt2l_GG_1p5_jesTotalDown 
      - coords: [-1.0]
        loader: tt2l_GG_1p0_jesTotalDown
      - coords: [-0.5]
        loader: tt2l_GG_0p5_jesTotalDown
      - coords: [0]
        loader: tt2l_GG_jesNominal
        nominal: true
      - coords: [0.5]
        loader: tt2l_GG_0p5_jesTotalUp
      - coords: [1.0]
        loader: tt2l_GG_1p0_jesTotalUp
      - coords: [1.5]
        loader: tt2l_GG_1p5_jesTotalUp
      - coords: [2.0]
        loader: tt2l_GG_2p0_jesTotalUp
    output:
      filename: icp_tt2l_GG_jesTotal.pkl

  - id: icp_tt2l_QG_Trigger
    type: icp
    region: SR
    parameters: [nu_trigger]
