jobs:
  - id: ich_NG_PDF4LHC21_4_TTLep_pow_2017
    type: ich
    region: SR_binned
    process: TTLep_pow_2017
    pdf:
      #pdf_n: [1, 2, 4, 5, 10, 12]
       #pdf_type: PODBasis
       pdf_n: [1,2,3,4]
       pdf_type: PODBasis
       pdf_basis: gluon_POD_nongluon_PDF4LHC21
 
  - id: icph_TTLep_pow_2017_L1Prefire
    type: icph
    region: SR_binned
    parameters: [nu_l1prefire]
    combinations: [[nu_l1prefire]]
    base_points:
      - coords: [-1.0]
        loader: TTLep_pow_2017
        removeweights: ["L1PreFiringWeight_Nom"] 
        addweights: ["L1PreFiringWeight_Dn"] 
      - coords: [ 0.0]
        loader: TTLep_pow_2017
        nominal: true
      - coords: [ 1.0]
        loader: TTLep_pow_2017
        removeweights: ["L1PreFiringWeight_Nom"] 
        addweights: ["L1PreFiringWeight_Up"] 
  
  - id: icph_TTLep_pow_2017_PU
    type: icph
    region: SR_binned
    parameters: [nu_pu]
    combinations: [[nu_pu]]
    base_points:
      - coords: [-1.0]
        loader: TTLep_pow_2017
        removeweights: ["Pileup_SF"] 
        addweights: ["Pileup_SFDn"] 
      - coords: [ 0.0]
        loader: TTLep_pow_2017
        nominal: true
      - coords: [ 1.0]
        loader: TTLep_pow_2017
        removeweights: ["Pileup_SF"] 
        addweights: ["Pileup_SFUp"] 

  - id: icph_TTLep_pow_2017_MuSF 
