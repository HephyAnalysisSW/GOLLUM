version: binned_2017_v5_CMSJES

defaults:
  module_samples: "data.samples_RunII"
  default_binning:
    - ["tr_ttbar_mass", [300, 400, 500, 650, 1500]]
    - ["tr_ttbar_y", [-2.5, -1.2, -0.8, -0.4, 0.4, 0.8, 1.2, 2.5]]

likelihood:
    binned:
        - id: SR_2017 
          classes: 
            - id: TTLep_pow_2017 
              sample: TTLep_pow_2017
              POI:
                job: ich_NG_PDF4LHC21_4_TTLep_pow_2017
                type: ich
                parameters: [c0, c1, c2, c3]
              systematics:
                - id: Normalization_TTLep
                  type: lnN
                  value: 0.05
                  parameters: [nu_norm_TTLep]
                - id: L1Prefire
                  type: icph
                  job: icph_TTLep_pow_2017_L1Prefire
                  parameters: [nu_l1prefire]
                - id: PU
                  type: icph
                  job: icph_TTLep_pow_2017_PU
